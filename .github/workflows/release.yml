name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_on_mac:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: |
          pnpm config delete proxy
          pnpm config delete https-proxy
          pnpm config delete registry
          pnpm install --frozen-lockfile

      - name: Prepare notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        # electron-builder expects APPLE_API_KEY to be the .p8 path and
        # APPLE_API_KEY_ID to be the key id. The repository secret
        # APPLE_API_KEY holds the key id.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          pnpm build:mac

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 3 -name '*.app' -type d | head -n1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_on_win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: |
          pnpm config delete proxy
          pnpm config delete https-proxy
          pnpm config delete registry
          pnpm install --frozen-lockfile

      - run: pnpm build:win
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_release:
    runs-on: ubuntu-latest
    needs: [build_on_mac, build_on_win]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'develop' || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Get current version
        id: version
        run: |
          set -e
          current_version=$(node -p "require('./package.json').version" || { echo "Error: Failed to retrieve current version from package.json"; exit 1; })
          echo "Current version: $current_version"
          
          # Calculate new version based on tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            new_version="${GITHUB_REF#refs/tags/v}"
          else
            echo "No valid tag found, using current version."
            new_version="$current_version"
          fi
          
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Release v${{ steps.version.outputs.new_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
