name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm check-types

      - name: Run regression tests
        run: pnpm test

  build-test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          
      - name: Build TypeScript (Electron)
        run: pnpm exec tsc -p electron
        
      - name: Build Frontend
        run: pnpm copy-files

  packaged-startup:
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
            executable: dist/win-unpacked/niconicomments-convert.exe
          - os: macos-15
            target: mac
            arch: arm64
            executable: dist/mac-arm64/niconicomments-convert.app/Contents/MacOS/niconicomments-convert
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run regression tests on the distribution OS
        run: pnpm test
      - name: Build Frontend
        run: pnpm copy-files
      - name: Package application for startup test
        run: pnpm exec electron-builder --dir --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Launch packaged application and check UI and IPC
        run: pnpm test:smoke "${{ matrix.executable }}"
